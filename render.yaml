# Render blueprint for the Ledgent voice gateway (native Node, no Docker).
services:
  - type: web
    name: ledgent-gateway
    runtime: node
    plan: free
    buildCommand: cd gateway && npm install --omit=dev
    startCommand: node gateway/server.js
    healthCheckPath: /health
    envVars:
      - key: GNANI_API_KEY
        sync: false          # set in the Render dashboard, never in git
      - key: ALLOWED_ORIGIN
        sync: false          # e.g. https://ledgent.netlify.app
      - key: GATEWAY_PORT
        value: "10000"
      - key: GNANI_TTS_VOICE
        value: Shivani
